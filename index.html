<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Create professional invoices online for free. Download PDF instantly. Perfect for freelancers, agencies, and small business owners in Pakistan.">
    <meta name="keywords" content="invoice generator, free invoice maker, online invoice generator pakistan, pdf invoice maker, freelancer invoice generator">
    <meta name="robots" content="index, follow">

    <!-- Social Media Share Preview -->
    <meta property="og:title" content="Free Online Invoice Maker | Enterprise Invoice Pro">
    <meta property="og:description" content="Generate instant PDF invoices for free. Fast, simple, and clean design.">
    <meta property="og:url" content="https://onlyscam47-blip.github.io/invoice-maker/">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { padding: 20px; background: #f4f6f9; color: #333; }
        .invoice-card { max-width: 800px; margin: auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        .invoice-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 25px; border-bottom: 2px solid #eee; padding-bottom: 20px; }
        .company-details h1 { margin: 0 0 5px 0; color: #2c3e50; font-size: 24px; }
        .company-details p { margin: 2px 0; color: #666; font-size: 13px; }
        .invoice-meta { text-align: right; }
        .invoice-meta h2 { margin: 0 0 10px 0; color: #3498db; letter-spacing: 1px; }
        .invoice-meta p { margin: 3px 0; font-size: 13px; color: #555; }
        .invoice-meta input { width: 130px; padding: 4px 8px; font-size: 12px; }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 10px; border-bottom: 1px solid #ddd; text-align: left; }
        th { background: #f8f9fa; }
        input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        
        .btn { padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 15px; }
        .btn-add { background: #e0e0e0; color: #333; }
        .btn-calc { background: #ff9800; color: #fff; margin-left: 10px; }
        .btn-print { background: #4caf50; color: #fff; }
        .btn-save { background: #2196f3; color: #fff; margin-left: 10px; }
        .btn-del { background: #e74c3c; color: #fff; padding: 5px 10px; border-radius: 3px; cursor: pointer; border: none; }
        
        .summary-box { float: right; width: 320px; margin-top: 20px; text-align: right; }
        .summary-row { display: flex; justify-content: space-between; padding: 5px 0; align-items: center; }
        .grand-total { font-weight: bold; font-size: 1.2em; color: #27ae60; border-top: 2px solid #ddd; padding-top: 8px; margin-top: 5px; }
        .actions { margin-top: 30px; clear: both; text-align: right; }
        .discount-field input { width: 90px; text-align: right; }
        
        @media print { .no-print { display: none !important; } .invoice-card { box-shadow: none; border: none; } input { border: none; background: transparent; } }
    </style>
</head>
<body>

<div class="invoice-card" id="invoice-content">
    
    <div class="invoice-header">
        <div class="company-details">
            <h1 contenteditable="true">ENTERPRISE PRO</h1>
            <p contenteditable="true">Business Solutions Ltd.</p>
            <p contenteditable="true">Email: info@company.com</p>
            <p contenteditable="true">Phone: +92 300 1234567</p>
        </div>
        <div class="invoice-meta">
            <h2>INVOICE</h2>
            <p><strong>Invoice #:</strong> <input type="text" value="INV-2026-001"></p>
            <p><strong>Date:</strong> <input type="date" id="inv-date"></p>
        </div>
    </div>

    <table id="items-table">
        <thead>
            <tr>
                <th>DESCRIPTION</th>
                <th width="100">QTY</th>
                <th width="120">PRICE</th>
                <th width="120">TOTAL</th>
                <th width="60" class="no-print">ACTION</th>
            </tr>
        </thead>
        <tbody id="item-rows">
            <tr>
                <td><input type="text" value="Premium Consulting Service" class="item-desc"></td>
                <td><input type="number" value="10" class="item-qty" oninput="calculateInvoice()"></td>
                <td><input type="number" value="2000" class="item-price" oninput="calculateInvoice()"></td>
                <td class="item-total">20000.00</td>
                <td class="no-print"><button class="btn-del" onclick="deleteRow(this)">X</button></td>
            </tr>
        </tbody>
    </table>

    <div class="no-print" style="margin-top: 15px;">
        <button class="btn btn-add" onclick="addRow()">+ Add Line Item</button>
        <button class="btn btn-calc" onclick="calculateInvoice()">🧮 Calculate Now</button>
    </div>

    <div class="summary-box">
        <div class="summary-row">
            <span>Subtotal:</span>
            <span>PKR <span id="subtotal-display">20000.00</span></span>
        </div>
        <div class="summary-row discount-field no-print">
            <label for="discount">Discount (% or PKR):</label>
            <input type="text" id="discount" value="10%" oninput="calculateInvoice()">
        </div>
        <div class="summary-row">
            <span>Discount:</span>
            <span style="color: #e74c3c;">- PKR <span id="discount-display">2000.00</span></span>
        </div>
        <div class="summary-row">
            <span>Tax (0%):</span>
            <span>PKR <span id="tax-display">0.00</span></span>
        </div>
        <div class="summary-row grand-total">
            <span>Grand Total:</span>
            <span>PKR <span id="grand-total-display">18000.00</span></span>
        </div>
    </div>

    <div class="actions no-print">
        <button class="btn btn-print" onclick="window.print()">🖨️ Print / Save PDF</button>
        <button class="btn btn-save" onclick="saveData()">💾 Save Invoice Data</button>
    </div>
</div>

<script>
    document.getElementById('inv-date').valueAsDate = new Date();

    function addRow() {
        const tbody = document.getElementById('item-rows');
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td><input type="text" placeholder="Item description" class="item-desc"></td>
            <td><input type="number" value="1" class="item-qty" oninput="calculateInvoice()"></td>
            <td><input type="number" value="0" class="item-price" oninput="calculateInvoice()"></td>
            <td class="item-total">0.00</td>
            <td class="no-print"><button class="btn-del" onclick="deleteRow(this)">X</button></td>
        `;
        tbody.appendChild(tr);
        calculateInvoice();
    }

    function deleteRow(btn) {
        const row = btn.closest('tr');
        row.remove();
        calculateInvoice();
    }

    function calculateInvoice() {
        const rows = document.querySelectorAll('#item-rows tr');
        let subtotal = 0;

        rows.forEach(row => {
            const qty = Math.abs(parseFloat(row.querySelector('.item-qty').value)) || 0;
            const price = Math.abs(parseFloat(row.querySelector('.item-price').value)) || 0;
            const total = qty * price;
            row.querySelector('.item-total').innerText = total.toFixed(2);
            subtotal += total;
        });

        document.getElementById('subtotal-display').innerText = subtotal.toFixed(2);

        const discountInput = document.getElementById('discount').value.trim();
        let discountVal = 0;
        let discountAmount = 0;

        if (discountInput.endsWith('%')) {
            discountVal = Math.abs(parseFloat(discountInput.replace('%', ''))) || 0;
            discountAmount = (subtotal * discountVal) / 100;
        } else {
            discountVal = Math.abs(parseFloat(discountInput)) || 0;
            discountAmount = discountVal;
        }

        if (discountAmount > subtotal) {
            discountAmount = subtotal;
        }

        const grandTotal = subtotal - discountAmount;

        document.getElementById('discount-display').innerText = discountAmount.toFixed(2);
        document.getElementById('grand-total-display').innerText = grandTotal.toFixed(2);
    }

    function saveData() {
        alert("Invoice Data Saved!");
    }

    calculateInvoice();
</script>

</body>
</html>
